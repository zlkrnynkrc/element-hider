<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 12px;
      background: #1e1e1e;
      color: #e0e0e0;
    }

    h2 {
      font-size: 14px;
      margin: 0 0 10px 0;
      color: #fff;
    }

    #hideBtn {
      width: 100%;
      padding: 10px;
      background: #d32f2f;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    #hideBtn:hover {
      background: #b71c1c;
    }

    #hideBtn:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #listTitle {
      font-size: 12px;
      margin: 14px 0 6px 0;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #list {
      max-height: 260px;
      overflow-y: auto;
      border-top: 1px solid #333;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 4px;
      border-bottom: 1px solid #2a2a2a;
      font-size: 12px;
    }

    .item .label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
      color: #4ec9b0;
    }

    .item button {
      background: #2d7d46;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
    }

    .item button:hover {
      background: #3a9b58;
    }

    .empty {
      padding: 12px 4px;
      color: #666;
      font-size: 12px;
      font-style: italic;
    }

    #status {
      font-size: 11px;
      color: #888;
      margin-top: 8px;
      text-align: center;
      min-height: 14px;
    }
  </style>
</head>

<body>
  <h2>Element Hider</h2>
  <button id="hideBtn">🔴 Gizle (Seçim Modu)</button>
  <button id="cancelBtn" style="
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  background: #444;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: none;
">❌ Seçimi İptal Et</button>
  <div id="status"></div>

  <div id="listTitle">Gizlenen Elementler</div>
  <div id="list"></div>

  <script src="popup.js"></script>
</body>

</html>
